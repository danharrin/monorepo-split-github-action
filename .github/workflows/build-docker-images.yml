name: build-docker-images

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: read

env:
  # see https://github.com/composer/composer/issues/9368#issuecomment-718112361
  COMPOSER_ROOT_VERSION: "dev-main"

jobs:
  publish-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/monorepo-split
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker build . --tag "${IMAGE_NAME}:latest" --build-arg "commitHash=${COMMIT_SHA}"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            docker tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${REF_NAME}"
            docker push "${IMAGE_NAME}:${REF_NAME}"
            echo "Pushed ${IMAGE_NAME}:${REF_NAME}"
          fi

          docker push "${IMAGE_NAME}:latest"
          echo "Pushed ${IMAGE_NAME}:latest"
